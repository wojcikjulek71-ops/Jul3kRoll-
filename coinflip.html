<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip</title>
    <link rel="stylesheet" href="styleglowna.css">
    <link rel="stylesheet" href="stylecoin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    
</head>
<body>

    <header>
        <h1 class="text1">COIN FLIP</h1>
        <div id="div1">
            <p class="text2"> <a href="Stronaglowna.html">Strona główna</a> </p>
            <p class="text2"> <a href="bank.html">Bank</a></p>
            <div class="text2 balance">
                <span>Gotówka:</span>
                <span id="bilans"></span>
                <button class="balance-reset" type="button" title="Resetuj gotówkę i saldo bankowe" onclick="window.balance.reset()">Reset</button>
                <span>Rekord:</span>
                <span id="rekord"></span>
            </div>
        </div>
        <div id="div2"></div>
    </header>

    <main id="main2">

        


<div id="container2">

    <div id="div3">
        <div id="orzel">
            <div id="przod">ORZEŁ</div>
            <div id="tyl">RESZKA</div>
        </div>

        <p id="wynik">Wybierz orła lub reszkę</p>
    </div>

    <div id="div4">
        <button class="przycisk1" type="button" data-side="orzel" aria-pressed="false" onclick="wybierz('orzel')">Orzeł</button>
        <button class="przycisk1" type="button" data-side="reszka" aria-pressed="false" onclick="wybierz('reszka')">Reszka</button>

        <br>

        <label class="visually-hidden" for="bet">Stawka</label>
        <input type="number" id="bet" placeholder="Stawka" min="1" step="1" required>

        <br>

        <button id="losuj" type="button" onclick="losowanie()">Losuj</button>
    </div>

</div>


    </main>



    

    <script src="main.js" defer></script>
    <script src="coinflip.js" defer></script>
</body>
</html>
